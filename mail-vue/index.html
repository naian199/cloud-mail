<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"/>
  <meta name="theme-color" content="#F1F1F1" id="theme-color-meta">
  <meta name="description" content="Cloud Mail 是一个 Serverless 响应式邮箱服务，支持邮件发送，可部署到 Cloudflare 平台，降低服务器成本。Cloud Mail is a serverless responsive email service that supports email sending and can be deployed on Cloudflare to reduce server costs.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cloud Mail">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/mail-pwa.png">
  <title>Cloud Mail</title>
  <link rel="icon" href="/public/mail.png" type="image/png">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    const uiStoreStr =  localStorage.getItem('ui')
    let isDark = false
    if (uiStoreStr) {
      const uiStore =  JSON.parse(uiStoreStr)
      isDark = uiStore.dark
      const root = document.documentElement
      root.setAttribute('class', isDark ? 'dark' : '');
    }
    const metaTag = document.getElementById('theme-color-meta');
    const isMobile =  !window.matchMedia("(pointer: fine) and (hover: hover)").matches;
    metaTag.setAttribute('content', isDark ? (isMobile ? '#141414' : '#000000') : (isMobile ? '#191A23' : '#F1F1F1'));
  </script>
</head>
<style>
  html {
    background: #FFFFFF;
  }
  .dark {
    background: #141414;
  }
  #loading-first {
    position:fixed;inset:0;display:flex;justify-content:center;align-items:center;z-index:500;
    background:var(--el-bg-color,#fff);transition:opacity 160ms ease-out;
  }
  .dark #loading-first {background:var(--el-bg-color,#141414);}
  #loading-first.loading-hide {pointer-events:none;opacity:0;}
  .loading-icon {display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .startup-mark {display:block;width:116px;height:116px;overflow:visible;}
  .startup-envelope {fill:none;stroke-width:4.8;stroke-linecap:round;stroke-linejoin:round;}
  .startup-envelope-white {animation:envelope-white-wait 1.6s ease-in-out infinite;}
  .startup-envelope-orange {animation:envelope-orange-wait 1.6s ease-in-out infinite;}
  .startup-cut {animation:envelope-cuts 1.6s ease-in-out infinite;}
  .connection-light {opacity:0;}
  .loading-locking .startup-envelope-white,.loading-locking .startup-envelope-orange {animation:envelope-lock 220ms ease-out both;}
  .loading-locking .startup-cut {animation:none;opacity:1;}
  .loading-complete .startup-envelope-white,.loading-complete .startup-envelope-orange {animation:none;transform:none;}
  .loading-complete .startup-cut {animation:none;opacity:1;}
  .loading-complete .connection-light {animation:connection-success 360ms ease-out both;}
  @keyframes envelope-white-wait {0%,100%{transform:translate(-9px,8px);opacity:.65;}45%,65%{transform:translate(0,0);opacity:1;}}
  @keyframes envelope-orange-wait {0%,100%{transform:translate(9px,-8px);opacity:.65;}45%,65%{transform:translate(0,0);opacity:1;}}
  @keyframes envelope-cuts {0%,22%,92%,100%{opacity:0;}44%,68%{opacity:1;}}
  @keyframes envelope-lock {from{transform:var(--startup-from,none);}to{transform:translate(0,0);opacity:1;}}
  @keyframes connection-success {0%{opacity:0;filter:drop-shadow(0 0 0 #80ffd8);}35%{opacity:1;filter:drop-shadow(0 0 4px #80ffd8);}100%{opacity:.9;filter:drop-shadow(0 0 1px #80ffd8);}}
  @media(max-width:480px){.startup-mark{width:104px;height:104px;}}
  @media(prefers-reduced-motion:reduce){
    #loading-first{transition:none;}
    .startup-envelope-white,.startup-envelope-orange,.loading-locking .startup-envelope-white,.loading-locking .startup-envelope-orange{animation:none;transform:none;}
    .startup-cut{animation:none;opacity:1;}
    .loading-complete .connection-light{animation:none;opacity:1;filter:none;}
  }
</style>
<body>
<div id="loading-first" role="status" aria-label="Cloud Mail loading" aria-busy="true">
  <div class="loading-icon">
    <svg class="startup-mark" viewBox="0 0 128 128" aria-hidden="true" focusable="false">
      <defs>
        <path id="startup-envelope" d="M24.8 63.7 43.5 75.8Q45.6 77.2 47.5 75.8L68.2 59.4Q71.6 56.5 74.8 59.4Q77.4 61.7 77.4 65.4V88.2Q77.4 95.8 70.2 95.8H26.1Q18.1 95.8 18.1 87.7V62.5Q18.1 54.6 26.1 54.6H55.1" />
        <mask id="startup-white-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
          <rect width="128" height="128" fill="white"/><circle class="startup-cut" cx="56" cy="68.9" r="4.1" fill="black"/>
        </mask>
        <mask id="startup-orange-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
          <rect width="128" height="128" fill="white"/><g class="startup-cut" fill="black"><circle cx="54.1" cy="54.6" r="4.1"/><circle cx="77.4" cy="71.8" r="4.1"/></g>
        </mask>
      </defs>
      <rect width="128" height="128" rx="25" fill="#2389f5"/>
      <g class="startup-envelope startup-envelope-white" stroke="#fff" mask="url(#startup-white-cut)"><use href="#startup-envelope"/></g>
      <g class="startup-envelope startup-envelope-orange" stroke="#ff7855" mask="url(#startup-orange-cut)"><use href="#startup-envelope" transform="translate(36 -24)"/></g>
      <g class="connection-light"><circle cx="56" cy="68.9" r="4" fill="#80ffd8" opacity=".3"/><circle cx="56" cy="68.9" r="1.7" fill="#fff"/></g>
      <g class="connection-light"><circle cx="77.4" cy="71.8" r="4" fill="#80ffd8" opacity=".3"/><circle cx="77.4" cy="71.8" r="1.7" fill="#fff"/></g>
    </svg>
  </div>
</div>
<script>document.getElementById('loading-first').dataset.startedAt=String(performance.now());</script>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
